<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            text-align: center;

            background: linear-gradient(
                135deg,
                #301934,
                #8c3fc7
            );

            color: white;
        }

        main {
            width: min(600px, 80%);
            padding: 40px;

            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;

            border: none;
            border-radius: 10px;

            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <main>
        <h1>Hello, world!</h1>

        <p>
            This is my first website hosted through GitHub Pages.
        </p>

        <button onclick="showMessage()">
            Click me
        </button>
    </main>

    <script>
        function showMessage() {
            alert("My website is working!");
        }
    </script>
</body>
</html>
